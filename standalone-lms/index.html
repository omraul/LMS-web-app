      --bg: #FAF8F5;
      --card: #FFFFFF;
      --sidebar: #F3EFE8;
      --ink: #1A2433;          /* 15.12:1 on --bg */
      --muted-ink: #4B596B;    /* 6.82:1 on --bg */
      --muted-bg: #EFECE6;
      --border: #DFD9CE;
      --primary: #1B3A5F;      /* Konkan Deep Indigo — 11.98:1 with white */
      --primary-hover: #142C49;
      --primary-soft: #E6EEF8;
      --accent: #6E320C;       /* Mandovi Terracotta — 8.45:1 on --accent-soft */
      --accent-soft: #F9EBDD;
      --success: #1E7145;      /* Western Ghats Green — 5.86:1 with white */
      --success-soft: #E5F5EC;
      --warning: #96540D;      /* Mandovi Ochre — 5.48:1 with white */
      --warning-soft: #FDF1E1;
      --danger: #A31F28;       /* Laterite Crimson — 6.94:1 with white */
      --danger-soft: #FCE8E9;
      --info: #155899;         /* Zuari Cobalt — 6.75:1 with white */
      --info-soft: #E6F0FA;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(26, 36, 51, 0.06);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.dark {
      --bg: #111822;
      --card: #172130;
      --sidebar: #0D131B;
      --ink: #F2EFE9;          /* 14.21:1 on --bg */
      --muted-ink: #A9B4C2;    /* 7.40:1 on --bg */
      --muted-bg: #202C3D;
      --border: #28364A;
      --primary: #66A3E0;
      --primary-hover: #82B6EA;
      --primary-soft: #1D324D;
      --accent: #F6B982;
      --accent-soft: #3B2412;
      --success: #4CC382;
      --success-soft: #133323;
      --warning: #F2A950;
      --warning-soft: #382610;
      --danger: #F06A73;
      --danger-soft: #3B181C;
      --info: #68B0F3;
      --info-soft: #162E47;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2, h3, .serif { font-family: var(--font-serif); letter-spacing: -0.015em; }
    code, .mono { font-family: var(--font-mono); }

    /* Top Role & Environment Bar */
    .top-banner {
      background: #142C49;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .top-banner-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .top-banner-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .role-select {
      background: #FFFFFF;
      color: #142C49;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-weight: 600;
      font-size: 12.5px;
      font-family: var(--font-sans);
      cursor: pointer;
    }
    .top-pill {
      background: rgba(255,255,255,0.14);
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 500;
    }

    /* App Layout */
    .app-shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 45px);
    }
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand-box {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-crest {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--primary);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-title { font-size: 17px; font-weight: 700; line-height: 1.15; }
    .brand-sub { font-size: 11px; color: var(--muted-ink); }

    .user-card {
      margin: 14px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .user-name { font-weight: 700; font-size: 14px; }
    .user-meta { font-size: 12px; color: var(--muted-ink); margin-top: 2px; }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .nav-list {
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--muted-bg); }
    .nav-btn.active {
      background: var(--primary);
      color: var(--bg);
      font-weight: 600;
    }
    .nav-tag {
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(0,0,0,0.12);
    }
    .nav-btn.active .nav-tag { background: rgba(255,255,255,0.22); color: inherit; }

    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted-ink);
    }

    .main-area {
      flex: 1;
      padding: 24px 28px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    /* Common UI Primitives */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .page-title { font-size: 26px; font-weight: 700; }
    .page-desc { font-size: 14px; color: var(--muted-ink); margin-top: 4px; max-width: 720px; }

    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 22px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-label { font-size: 12.5px; color: var(--muted-ink); font-weight: 600; }
    .stat-value { font-size: 28px; font-weight: 700; margin-top: 4px; font-family: var(--font-serif); }
    .stat-sub { font-size: 12px; color: var(--muted-ink); margin-top: 4px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;

    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-info { background: var(--info-soft); color: var(--info); }
    .badge-neutral { background: var(--muted-bg); color: var(--muted-ink); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: var(--bg); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border-color: var(--border); color: var(--ink); }
    .btn-outline:hover { background: var(--muted-bg); }
    .btn-warning { background: var(--warning); color: #FFFFFF; }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-danger { background: var(--danger); color: #FFFFFF; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13.5px;
    }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 2px solid var(--primary);

    }

    .resp-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .resp-table th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--muted-ink);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .resp-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .alert-box {
      padding: 14px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      border: 1px solid var(--border);
      font-size: 13.5px;
    }
    .alert-warning { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); }
    .alert-success { background: var(--success-soft); color: var(--success); border-color: var(--success); }
    .alert-danger { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
    .alert-info { background: var(--info-soft); color: var(--info); border-color: var(--info); }

    .sticky-exam-bar {
      position: sticky;
      top: 8px;
      z-index: 20;
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-sans);
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    /* Mobile 360px responsiveness */
    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .nav-list { flex-direction: row; overflow-x: auto; padding: 8px; }
      .nav-btn { white-space: nowrap; width: auto; }
      .main-area { padding: 16px 14px; }
      .resp-table thead { display: none; }
      .resp-table, .resp-table tbody, .resp-table tr, .resp-table td { display: block; width: 100%; }
      .resp-table tr {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 10px;
        padding: 8px 12px;
      }
      .resp-table td {
        border-bottom: none;
        padding: 5px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .resp-table td::before {
        content: attr(data-label);
        font-weight: 600;
        font-size: 11.5px;
        color: var(--muted-ink);
        text-transform: uppercase;
      }
    }
  </style>
</head>

                <th>ISA-II (${w.isa2}%)</th>

    function renderRoster() {
      const validCount = state.csvPreview.filter(r => r.status === "valid").length;
      const dupCount = state.csvPreview.filter(r => r.status === "duplicate").length;
      const badCount = state.csvPreview.filter(r => r.status === "malformed").length;

      return `
        <div class="page-header">

        ${state.csvPreview.length > 0 ? `

            <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;">
              <button class="btn btn-outline" onclick="state.csvPreview=[];renderApp();">Clear Preview</button>
              <button class="btn btn-primary" ${state.csvMode === "atomic" && badCount > 0 ? "disabled" : ""} onclick="commitCsvRoster()">

        ${state.csvCommittedReport ? `
          <div class="alert-box alert-success">

        <div class="card">

    function renderDpdpAndBrief() {

    // =========================================================================
    // INTERACTIVE HANDLERS
    // =========================================================================
    window.switchTab = function(tabId) {

      renderApp();

    window.approveGrade = function(subIdx) {
      const inp = document.getElementById(`gradeInput_${subIdx}`);
      const val = inp ? Number(inp.value) : SUBMISSIONS[subIdx].aiScore;
      SUBMISSIONS[subIdx].finalScore = Math.max(0, Math.min(SUBMISSIONS[subIdx].maxScore, val));
      SUBMISSIONS[subIdx].status = "graded";

    window.updateWeights = function() {
      state.weights.isa1 = Number(document.getElementById("w_isa1").value || 0);
      state.weights.isa2 = Number(document.getElementById("w_isa2").value || 0);
      state.weights.see = Number(document.getElementById("w_see").value || 0);
      renderApp();
    };

    window.downloadTranscriptCsv = function() {
      const w = state.weights;
      const totalW = (w.isa1 + w.isa2 + w.see) || 100;
      const rows = [
        ["Roll No", "Student Name", "Email", `ISA-I (${w.isa1}%)`, `ISA-II (${w.isa2}%)`, `SEE (${w.see}%)`, "Weighted Final (%)", "NEP Letter Grade", "Grade Point", "Attendance (%)"]
      ];
      GRADEBOOK_STUDENTS.forEach(st => {
        const finalPct = Math.round((st.isa1 * w.isa1 + st.isa2 * w.isa2 + st.see * w.see) / totalW);
        const lg = computeLetterGrade(finalPct);
        rows.push([st.rollNo, st.name, st.email, st.isa1, st.isa2, st.see, finalPct, lg.grade, lg.gp, st.attendance]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "dempo-vidya-official-transcript.csv";
      a.click();
    };

    function parseCsvIntoPreview(rawText) {
      const lines = rawText.replace(/\r\n/g, "\n").split("\n").filter(l => l.trim().length > 0);
      const seen = new Map();
      const rows = lines.slice(1).map((line, idx) => {
        const rowNumber = idx + 2;
        const [rollNo = "", name = "", emailRaw = "", roleRaw = "student"] = line.split(",").map(s => s.trim());
        const email = emailRaw.toLowerCase();
        const role = (roleRaw || "student").toLowerCase();
        if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
          return { rowNumber, rollNo, name, email: emailRaw, role, status: "malformed", reason: "Invalid email syntax" };
        }
        if (!name) {
          return { rowNumber, rollNo, name, email, role, status: "malformed", reason: "Missing student full name" };
        }
        if (role !== "student" && role !== "teacher") {
          return { rowNumber, rollNo, name, email, role, status: "malformed", reason: `Invalid role '${role}'` };
        }
        if (seen.has(email)) {
          return { rowNumber, rollNo, name, email, role, status: "duplicate", reason: `First seen on row #${seen.get(email)}` };
        }
        seen.set(email, rowNumber);
        return { rowNumber, rollNo, name, email, role, status: "valid" };
      });
      state.csvPreview = rows;
      state.csvCommittedReport = null;
      renderApp();
    }

    window.loadSampleRosterCsv = function() {
      const sample = [
        "roll_no,name,email,role",
        "26BCOM011,Tanvi Shirodkar,tanvi.shirodkar@dempocollege.edu.in,student",
        "26BCOM012,Siddharth Palekar,siddharth.palekar@dempocollege.edu.in,student",
        "26BCOM013,,missing.name@dempocollege.edu.in,student",
        "26BCOM014,Tanvi DuplicateRow,tanvi.shirodkar@dempocollege.edu.in,student",
        "26BCOM015,Komal Borkar,not-an-email-address,student",
        "26BBA021,Ananya Verlekar,ananya.verlekar@dempocollege.edu.in,student",
        "FAC019,Prof. Nikhil Sardesai,nikhil.sardesai@dempocollege.edu.in,teacher"
      ].join("\n");
      parseCsvIntoPreview(sample);
    };

    window.handleCsvFileUpload = function(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => parseCsvIntoPreview(String(reader.result || ""));
      reader.readAsText(file);
    };

    window.commitCsvRoster = function() {
      const valid = state.csvPreview.filter(r => r.status === "valid");
      const duplicates = state.csvPreview.filter(r => r.status === "duplicate").length;
      const malformed = state.csvPreview.filter(r => r.status === "malformed").length;
      let created = 0, updated = 0, skipped = 0;

      valid.forEach(r => {
        const existing = state.invitedRoster.find(u => u.email === r.email);
        if (existing) {
          if (state.csvDuplicatePolicy === "skip") {
            skipped += 1;
          } else {
            existing.name = r.name;
            existing.rollNo = r.rollNo;
            existing.role = r.role;
            updated += 1;
          }
        } else {
          state.invitedRoster.unshift({
            id: Date.now() + Math.random(),
            rollNo: r.rollNo,
            name: r.name,
            email: r.email,
            role: r.role,
            cohort: r.role === "teacher" ? "Faculty Senate" : "FY/SY B.Com Hons — Div A",
            joined: false
          });
          created += 1;
        }
      });

      state.csvCommittedReport = {
        total: state.csvPreview.length,
        created,
        updated,
        skipped,
        duplicates,
        malformed
      };
      state.csvPreview = [];
      renderApp();
    };

    window.exportDpdpJson = function() {
      const user = ROLES[state.roleKey];
      const payload = {
        exportedAt: new Date().toISOString(),
        statute: "Digital Personal Data Protection Act, 2023 (India) — Section 11 Right to Access",
        dataFiduciary: "Srinivassa Sinai Dempo College of Commerce & Economics (Autonomous), Goa",
        dataResidency: "Mumbai, India (ap-south-1)",
        profile: user,
        enrolledCourses: COURSES.map(c => ({ code: c.code, title: c.title, attendancePct: c.attendancePct })),
        savedExamDrafts: state.examAnswers
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "dempo-vidya-my-dpdp-data.json";
      a.click();
    };

    function renderApp() {
      renderSidebar();
      const main = document.getElementById("mainArea");
      if (state.activeTab === "dashboard") main.innerHTML = renderDashboard();
      else if (state.activeTab === "courses") main.innerHTML = renderCourses();
      else if (state.activeTab === "exam") main.innerHTML = renderExam();
      else if (state.activeTab === "grading") main.innerHTML = renderGrading();
      else if (state.activeTab === "gradebook") main.innerHTML = renderGradebook();
      else if (state.activeTab === "roster") main.innerHTML = renderRoster();
      else if (state.activeTab === "dpdp") main.innerHTML = renderDpdpAndBrief();
    }

    document.getElementById("roleSwitcher").addEventListener("change", (e) => {
      state.roleKey = e.target.value;
      renderApp();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent =
        document.body.classList.contains("dark") ? "Light Mode" : "Night Mode";
    });

    renderApp();
  </script>
